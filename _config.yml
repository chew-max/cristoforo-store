# =========================================================
# STORE SEO
# Update these values when cloning the storefront.
# =========================================================

title: "S. CRISTOFORO - CARRY YOUR PURPOSE"
description: "More than Fashion. A Calling. Faith Without Compromise"

url: "https://houseofcristoforo.mthpinnacle.store/"
baseurl: ""

logo: "/assets/images/logo.svg"

markdown: kramdown
permalink: pretty

collections:
  products:
    output: true
    permalink: /products/:name/

defaults:
  - scope:
      path: ""
      type: products
    values:
      layout: product
      seo:
        type: Product

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor